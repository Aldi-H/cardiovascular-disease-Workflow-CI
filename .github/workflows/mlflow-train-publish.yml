name: Workflow CI - MLflow and Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download latest preprocessed dataset from private B2
        run: >-
          python download_preprocessed_dataset.py
          --output-dir MLProject/cardiovascular-disease_preprocessing

      - name: Train through MLflow Project
        run: mlflow run ./MLProject -e train --env-manager=local

      - name: Export best B2-backed run
        run: python src/export_best_run.py --output-dir ci_artifacts

      - name: Store model and evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cardiovascular-model-and-evaluation
          path: ci_artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Set selected model URI
        run: echo "MODEL_URI=$(cat ci_artifacts/model_uri.txt)" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push MLflow model image
        shell: bash
        run: |
          image="${DOCKERHUB_USERNAME}/cardiovascular-disease-mlflow:${GITHUB_SHA:0:12}"
          mlflow models build-docker \
            --model-uri "$MODEL_URI" \
            --name "$image" \
            --env-manager local \
            --enable-mlserver
          docker push "$image"
